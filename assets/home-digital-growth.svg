<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="title desc">
  <title id="title">A clear path from strategy to growth</title>
  <desc id="desc">Three connected steps: strategy, design, and growth.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf1ff"/>
      <stop offset=".55" stop-color="#e2e9ff"/>
      <stop offset="1" stop-color="#d9e3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".62" cy=".39" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".88"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5d8aff"/>
      <stop offset="1" stop-color="#3569ee"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#344c91" flood-opacity=".12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#344c91" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="780" height="600" rx="34" fill="url(#canvas)"/>
  <rect width="780" height="600" rx="34" fill="url(#glow)"/>
  <circle cx="548" cy="298" r="226" fill="#fff" opacity=".23"/>
  <circle cx="548" cy="298" r="190" fill="none" stroke="#9db5ff" stroke-opacity=".3" stroke-width="1.5"/>
  <circle cx="548" cy="298" r="154" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="1.5"/>

  <path d="M98 423C172 414 206 359 278 352s102-52 176-67 94-55 163-69" fill="none" stroke="#4778f5" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 11" opacity=".72"/>
  <circle cx="98" cy="423" r="7" fill="#fff" stroke="#4778f5" stroke-width="3"/>
  <circle cx="617" cy="216" r="8" fill="#4778f5" stroke="#fff" stroke-width="4"/>

  <g filter="url(#cardShadow)">
    <rect x="39" y="252" width="196" height="260" rx="22" fill="#fffefa"/>
    <rect x="40" y="253" width="194" height="258" rx="21" fill="none" stroke="#fff" stroke-opacity=".9"/>
    <text x="61" y="282" fill="#858a98" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">01  /  LISTEN</text>
    <rect x="60" y="302" width="62" height="62" rx="18" fill="#e8eeff"/>
    <circle cx="91" cy="333" r="15" fill="none" stroke="url(#iconBlue)" stroke-width="2.6"/>
    <circle cx="91" cy="333" r="5" fill="none" stroke="url(#iconBlue)" stroke-width="2.6"/>
    <path d="m102 322 8-7m-4 0h4v4" fill="none" stroke="#4778f5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="403" fill="#24252b" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-.7">Strategy</text>
    <text x="60" y="430" fill="#777c88" font-family="Arial, sans-serif" font-size="12">Find the clearest</text>
    <text x="60" y="448" fill="#777c88" font-family="Arial, sans-serif" font-size="12">next move.</text>
    <path d="M60 477h118" stroke="#e7e8ec" stroke-width="1.5"/>
    <circle cx="64" cy="493" r="4" fill="#4778f5"/>
    <path d="M75 493h69" stroke="#d8dce8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="292" y="171" width="196" height="260" rx="22" fill="#fffefa"/>
    <rect x="293" y="172" width="194" height="258" rx="21" fill="none" stroke="#fff" stroke-opacity=".9"/>
    <text x="314" y="201" fill="#858a98" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">02  /  CREATE</text>
    <rect x="313" y="221" width="62" height="62" rx="18" fill="#e8eeff"/>
    <rect x="329" y="237" width="31" height="29" rx="4" fill="none" stroke="url(#iconBlue)" stroke-width="2.5"/>
    <path d="M329 244h31m-26-4h.01m4 0h.01m-9 11h15m-15 5h10" fill="none" stroke="#4778f5" stroke-width="2.1" stroke-linecap="round"/>
    <text x="313" y="322" fill="#24252b" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-.7">Design</text>
    <text x="313" y="349" fill="#777c88" font-family="Arial, sans-serif" font-size="12">Make your value</text>
    <text x="313" y="367" fill="#777c88" font-family="Arial, sans-serif" font-size="12">easy to see.</text>
    <path d="M313 396h118" stroke="#e7e8ec" stroke-width="1.5"/>
    <circle cx="317" cy="412" r="4" fill="#4778f5"/>
    <path d="M328 412h69" stroke="#d8dce8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="545" y="90" width="196" height="260" rx="22" fill="#fffefa"/>
    <rect x="546" y="91" width="194" height="258" rx="21" fill="none" stroke="#fff" stroke-opacity=".9"/>
    <text x="566" y="120" fill="#858a98" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">03  /  GROW</text>
    <rect x="566" y="140" width="62" height="62" rx="18" fill="#e8eeff"/>
    <path d="M583 186v-9m11 9v-17m11 17v-25m10 25h-36" fill="none" stroke="url(#iconBlue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m585 169 9-7 8 3 10-12m-1 0h5v5" fill="none" stroke="#4778f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="566" y="241" fill="#24252b" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-.7">Growth</text>
    <text x="566" y="268" fill="#777c88" font-family="Arial, sans-serif" font-size="12">Turn attention</text>
    <text x="566" y="286" fill="#777c88" font-family="Arial, sans-serif" font-size="12">into action.</text>
    <path d="M566 315h118" stroke="#e7e8ec" stroke-width="1.5"/>
    <circle cx="570" cy="331" r="4" fill="#4778f5"/>
    <path d="M581 331h69" stroke="#d8dce8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="431" y="493" width="304" height="61" rx="30.5" fill="#fffefa"/>
    <circle cx="462" cy="523.5" r="14" fill="#4778f5"/>
    <path d="m456 524 4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="488" y="528" fill="#424652" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".45">A clearer path to growth</text>
    <path d="m700 520 8 8m0-8-8 8" stroke="#4778f5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <circle cx="99" cy="169" r="3" fill="#4778f5" opacity=".55"/>
  <circle cx="122" cy="151" r="2" fill="#4778f5" opacity=".3"/>
  <circle cx="754" cy="408" r="4" fill="#4778f5" opacity=".42"/>
  <path d="m739 425 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z" fill="#4778f5" opacity=".65"/>
</svg>
